name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here on purpose: pnpm/action-setup reads the version from
      # the root package.json `packageManager` field, so CI and local dev agree.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm does not run dependency install scripts by default, so Playwright
      # never downloads its browsers during `pnpm install`. The test suite
      # drives a REAL Chromium, so fetch it (plus the OS libs it links against)
      # explicitly. Only chromium: no test touches firefox/webkit.
      - name: Install Playwright Chromium
        run: pnpm --filter @webhands/core exec playwright install --with-deps chromium

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm -r build

      # Some tests launch HEADED (`setup-profile`, the headed-launch case), which
      # needs an X display the runner does not have. xvfb-run supplies a virtual
      # one; headless tests are unaffected.
      #
      # KEPT EXPLICIT even though `@webhands/core`'s test script now wraps itself
      # (scripts/with-display.mjs does the same thing for a contributor on a
      # display-less box). The wrapper sees this outer DISPLAY and steps aside,
      # so there is no nesting, and the gate does not depend on the runner image
      # happening to ship xvfb-run.
      - name: Test
        run: xvfb-run -a pnpm -r test
